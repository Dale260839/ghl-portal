<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BuildSuite Project Hub — Presenter HUD</title>
<style>
:root{
  --ink:#080c13; --panel:#111722; --raise:#161d2b; --raise2:#1c2434;
  --line:#232c3c; --line2:#303b4e;
  --tx:#e9edf5; --mut:#93a0b6; --faint:#5f6b81;
  --accent:#4fd6c9; --accent-dim:#173735;
  --signal:#ffb454; --signal-dim:#3a2c14;
  --warn:#ff6b6b; --warn-dim:#331a1c;
  --good:#5bd88a;
  --sig-glow:0 0 0 2px var(--signal), 0 0 22px -2px rgba(255,180,84,.55);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}

/* ── topbar ── */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:9px 18px;
  background:linear-gradient(180deg,#0d121b,#080c13);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.privacy{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--signal);background:var(--signal-dim);border:1px solid #4d3a1a;
  padding:5px 10px;border-radius:6px;white-space:nowrap}
.privacy svg{width:13px;height:13px;stroke:var(--signal);fill:none;stroke-width:2}
.spacer{flex:1}
.progresswrap{display:flex;align-items:center;gap:12px}
.progresswrap .count{font-family:var(--mono);font-size:12px;color:var(--mut)}
.pbar{width:140px;height:5px;border-radius:3px;background:var(--raise2);overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7be7dd);transition:width .2s}
.clock{font-family:var(--mono);font-size:12px;color:var(--mut);border:1px solid var(--line);
  padding:5px 9px;border-radius:7px;background:var(--panel);cursor:pointer;user-select:none}
.clock.behind{border-color:rgba(255,180,84,.6);background:var(--signal-dim);color:var(--signal)}
.clock b{color:var(--tx)}
.modes{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:3px}
.modes button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut);background:none;border:0;padding:6px 11px;border-radius:6px;cursor:pointer}
.modes button.on{background:var(--accent);color:#04231f;font-weight:600}

/* ── shell ── */
.shell{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 47px)}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side .head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.side .head .t{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.seq{flex:1;overflow-y:auto;padding:8px 9px}
.seqgroup{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  padding:12px 9px 5px;border-top:1px solid var(--line);margin-top:8px}
.seqgroup:first-child{border-top:0;margin-top:0}
.step{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:9px;width:100%;text-align:left;
  cursor:pointer;padding:8px 9px;border-radius:8px;border:1px solid transparent;background:none;color:var(--mut);
  font-family:inherit;font-size:13.5px;margin-bottom:2px}
.step:hover{background:var(--raise);color:var(--tx)}
.step .num{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}
.step .lbl{line-height:1.25}
.step.active{background:var(--accent-dim);border-color:#2f5c58;color:var(--tx)}
.step.active .num{color:var(--accent)}
.step.done .num{color:var(--good)}
.step .flag svg{width:15px;height:15px;stroke:var(--warn);fill:none;stroke-width:2;display:block}
.step .star{color:var(--signal)}
.navfoot{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:9px}
.navbtns{display:flex;gap:8px}
.navbtns button{flex:1;font-family:var(--mono);font-size:12px;letter-spacing:.05em;padding:9px;border-radius:8px;
  border:1px solid var(--line2);background:var(--raise);color:var(--tx);cursor:pointer;text-transform:uppercase}
.navbtns button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.navbtns button:disabled{opacity:.35;cursor:default}
.nextup{font-size:12px;color:var(--faint)}
.nextup b{color:var(--mut);font-weight:500}

/* ── main ── */
.main{min-width:0;padding:22px 26px 60px;max-width:1120px}
.stephead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.stephead .of{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
h1.title{font-size:27px;line-height:1.15;margin:4px 0 0;font-weight:700;letter-spacing:-.01em}
.time{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mut);white-space:nowrap;
  border:1px solid var(--line);padding:5px 10px;border-radius:7px;background:var(--panel)}
.time b{color:var(--tx)}

.primary{display:flex;gap:10px;align-items:baseline;margin:14px 0 16px;padding:12px 15px;background:var(--raise);
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 9px 9px 0}
.primary .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);white-space:nowrap}
.primary .v{font-size:15px;color:var(--tx);font-weight:500}

/* Two columns: the screen you are looking at on the left, the words on the
   right. The left column is sticky so the view stays put while you read down
   the script — on a call the picture is the thing you keep glancing back to. */
.cols{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:18px}
.colL{position:sticky;top:59px}
.colR{min-width:0}
.colL .sec,.colR .sec{margin-top:0}
.colR>*+*{margin-top:14px}
.colR .mouse,.colR .say,.colR .watch,.colR .then{margin-top:0}
@media (max-width:1180px){.cols{grid-template-columns:1fr}.colL{position:static}}

.sec{margin-top:18px}
.sec>.label{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sec>.label .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sec>.label .rule{flex:1;height:1px;background:var(--line)}
.view-tag .tag{color:var(--accent)}

/* ── system view ── */
.viewport{position:relative;background:#0b0f16;border:1px solid var(--line2);border-radius:12px;overflow:hidden;
  box-shadow:0 12px 40px -12px rgba(0,0,0,.7)}
.vchrome{display:flex;align-items:center;gap:7px;padding:8px 12px;background:#090d14;border-bottom:1px solid var(--line)}
.vchrome .tl{display:flex;gap:6px}
.vchrome .tl i{width:10px;height:10px;border-radius:50%;background:#2a3240}
.vchrome .url{font-family:var(--mono);font-size:11px;color:var(--mut);background:#10151e;border:1px solid var(--line);
  border-radius:6px;padding:4px 10px;margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app{display:grid;grid-template-columns:158px 1fr;min-height:300px}
.app.nosidebar{grid-template-columns:1fr}
.aside{background:#0a0e15;border-right:1px solid var(--line);padding:11px 8px;display:flex;flex-direction:column;gap:2px}
.abrand{font-weight:700;font-size:14px;padding:2px 8px 9px;letter-spacing:.02em}
.abrand span{color:var(--accent)}
.anav{font-size:11px;color:var(--mut);padding:5px 9px;border-radius:6px;display:flex;align-items:center;gap:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anav .b{width:6px;height:6px;border-radius:2px;background:#3a4557;flex:none}
.anav.on{background:var(--accent-dim);color:var(--tx)}
.anav.on .b{background:var(--accent)}
.abody{padding:15px;min-width:0;background:#0d121b;background-image:radial-gradient(circle at 92% -12%,#141b27,transparent 55%)}
.atitle{font-size:15px;font-weight:600;margin-bottom:11px}
.acards{display:grid;gap:9px;margin-bottom:10px}
.acard{background:#101724;border:1px solid var(--line);border-radius:9px;padding:11px 12px;min-height:44px}
.acard .cl{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.acard .cv{font-size:12px;margin-top:5px;color:var(--tx)}
.abtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.abtn{font-size:10.5px;padding:6px 11px;border-radius:7px;border:1px solid var(--line2);background:#1a2231;color:var(--mut)}

/* highlight + avoid */
.hl{position:relative;box-shadow:var(--sig-glow);outline:1px solid var(--signal);z-index:2}
.hl::after{content:attr(data-tip);position:absolute;top:-11px;left:-8px;z-index:3;font-family:var(--mono);
  font-size:10px;font-weight:600;color:#3a2400;background:var(--signal);padding:2px 8px;border-radius:20px;
  white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.avoid{position:relative;opacity:.55;filter:grayscale(.4)}
.avoid::after{content:"AVOID";position:absolute;top:-9px;right:-6px;z-index:3;font-family:var(--mono);font-size:9px;
  font-weight:600;color:#fff;background:var(--warn);padding:2px 7px;border-radius:20px}

.route{display:inline-flex;align-items:center;gap:8px;margin-top:11px;font-family:var(--mono);font-size:12px}
.route .rk{color:var(--faint);letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.route .rv{color:var(--accent);background:var(--accent-dim);padding:3px 9px;border-radius:6px}

/* ── mouse / say / watch ── */
.mouse{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;background:var(--raise);
  border:1px solid var(--line);border-radius:10px;margin-top:16px}
.mouse .ico{flex:none;width:30px;height:30px;border-radius:8px;background:var(--signal-dim);border:1px solid #4d3a1a;
  display:grid;place-items:center}
.mouse .ico svg{width:16px;height:16px;stroke:var(--signal);fill:none;stroke-width:2}
.mouse .mh{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--signal);margin-bottom:3px}
.mouse p{margin:0;font-size:15px}

.say{margin-top:16px;background:linear-gradient(180deg,#121a18,#0e1413);border:1px solid #24463f;border-radius:12px;padding:18px 20px}
.say .sl{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.say .sl .tag{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.say .sl .rule{flex:1;height:1px;background:#24463f}
.say p{margin:0;font-size:20px;line-height:1.5;color:#eef6f3}

.watch{margin-top:16px;background:var(--warn-dim);border:1px solid #52282b;border-left:3px solid var(--warn);
  border-radius:0 10px 10px 0;padding:13px 16px}
.watch .wl{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--warn);margin-bottom:8px}
.watch .wl svg{width:15px;height:15px;stroke:var(--warn);fill:none;stroke-width:2}
.watch ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.watch li{font-size:14.5px;color:#ffdcdc}

details.hood{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.hood>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:9px}
details.hood>summary::-webkit-details-marker{display:none}
details.hood>summary .tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
details.hood>summary .hint{margin-left:auto;font-size:11px;color:var(--faint)}
details.hood[open]>summary{border-bottom:1px solid var(--line)}
.hoodbody{padding:13px 15px;display:flex;flex-direction:column;gap:11px}
.hoodbody .q{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.hoodbody .simple .q{color:var(--accent)}
.hoodbody .a{font-size:14px;color:var(--tx)}

.ask{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 15px}
.ask .qitem{padding:9px 0;border-top:1px dashed var(--line)}
.ask .qitem:first-of-type{border-top:0;padding-top:0}
.ask .qq{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;gap:7px}
.ask .qq .m{color:var(--signal);font-family:var(--mono)}
.ask .qa{font-size:14px;color:var(--mut)}

.then{margin-top:16px;display:flex;gap:11px;align-items:center;padding:13px 16px;background:var(--accent-dim);
  border:1px solid #2f5c58;border-radius:10px}
.then .ico{flex:none;width:28px;height:28px;border-radius:8px;background:#0c2624;display:grid;place-items:center}
.then .ico svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2}
.then .tl{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.then p{margin:0;font-size:15px}

/* ── presenter mode ── */
body.presenter .side,
body.presenter .primary,
body.presenter .sec.hoodsec,
body.presenter .sec.asksec,
body.presenter .time,
body.presenter .sec.view-tag>.label{display:none}
body.presenter .shell{grid-template-columns:1fr}
body.presenter .main{max-width:none;padding:26px 44px}
body.presenter .say p{font-size:27px;line-height:1.45}
body.presenter .mouse p{font-size:19px}
body.presenter .watch li{font-size:17px}
body.presenter h1.title{font-size:33px}
body.presenter .viewport{max-width:none}
body.presenter .cols{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:22px}
body.presenter .app{min-height:240px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#222a38;border-radius:6px;border:2px solid var(--panel)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.app{grid-template-columns:1fr}.aside{display:none}}

/* ── paper backup ── */
#print{display:none}
@media print{
  .topbar,.shell{display:none}
  #print{display:block;color:#000;background:#fff;font-size:11pt}
  #print h2{font-size:13pt;margin:16pt 0 2pt;page-break-after:avoid}
  #print .m{font-size:9pt;color:#555;margin:0 0 5pt}
  #print p{margin:0 0 5pt;line-height:1.45}
  #print .k{font-weight:700;font-size:8pt;letter-spacing:.08em;text-transform:uppercase}
  #print .stp{page-break-inside:avoid;margin-bottom:11pt}
  html,body{background:#fff}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>BUILDSUITE PROJECT HUB · PRESENTER HUD</div>
  <div class="privacy">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Second screen only — your private guide
  </div>
  <div class="spacer"></div>
  <div class="progresswrap">
    <span class="count" id="count">01 / 23</span>
    <span class="pbar"><i id="pbar" style="width:4%"></i></span>
  </div>
  <div class="clock" id="clock" title="Click or press T to start the clock">⏱ <b>0:00</b> / 33:50</div>
  <div class="modes">
    <button id="mFull" class="on">Full Guide</button>
    <button id="mPres">Presenter</button>
  </div>
</div>

<div class="shell">
  <nav class="side">
    <div class="head"><div class="t">Walkthrough sequence</div></div>
    <div class="seq" id="seq"></div>
    <div class="navfoot">
      <div class="navbtns">
        <button id="prev">← Prev</button>
        <button id="next">Next →</button>
      </div>
      <div class="nextup" id="nextup"></div>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>

<div id="print"><div id="print-body"></div></div>

<script>

const STEPS = [{"title":"Before you share","risk":true,"primary":"Set the stage so nothing embarrassing is on screen when you hit share.","seconds":45,"screen":"signin","hover":"Nothing yet. Hands off until the share starts.","say":"Thanks for the time. Last time we showed you the plumbing before the product. Today we go the other way: what your homeowner sees first, then the control you have over it. Forty minutes, stop me whenever.","watch":"This HUD goes on the OTHER screen. Close Slack and email. Have GoHighLevel open and logged into the Alliance sub-account, and a second tab already on the Hub dashboard. Browser at 110%.\n\nThe clock counts talking time only — with questions this runs closer to an hour. If they only have twenty minutes, do the eight starred steps.","then":"Share the screen. Go to GoHighLevel."},{"title":"It lives inside GoHighLevel","primary":"It lives inside the tool your team already uses — no new login, no new habit.","hoodSimple":"It's a menu item inside GoHighLevel that opens the Hub already signed in as your company.","seconds":75,"screen":"systems","hotspot":"ghl","hover":"The Project Hub item in the GoHighLevel left menu. Hover it, do not click yet.","say":"Nothing new to log into. The Project Hub is an item in the same left menu your team already uses. One click, no second password.","watch":"Be in the Alliance sub-account before you click. If the menu item is not there, go straight to the Hub tab and say the menu link is a GoHighLevel setting we hand over at the end — do not hunt for it live.","then":"Click it. Let the \"signing you in\" screen sit for a beat.","backend":"A GoHighLevel Custom Menu Link, opening our URL with the sub-account id on the query string — the same shape BuildSuite's own menu link uses. GoHighLevel does not substitute merge fields in these links, so each sub-account needs its own link with the id written in. A Marketplace app removes that later.","ifAsked":[{"q":"Do our staff need separate accounts?","a":"No. If they can get into GoHighLevel, they can get in here."}]},{"title":"The sign-in check","primary":"We verify with GoHighLevel that it's really your account before showing a single row.","hoodSimple":"Before showing anything, we ask GoHighLevel to confirm the account is real and ours to serve. If we can't reach them, we refuse rather than let someone through.","seconds":40,"screen":"signin","hover":"Nothing. Let it land on its own.","say":"That pause is us asking GoHighLevel whether this really is your account, before we show anything. It is the difference between a link that works and a link anyone could forward.","watch":"It is quick. If you miss it, do not go back for it. Say \"verifying\", never \"loading\".","then":"Land on the dashboard.","backend":"The id in the URL is a claim, not proof — plain text anyone could edit. So we call the GoHighLevel API with our own credential and ask whether that sub-account is real and reachable by us. If GoHighLevel is unreachable we refuse rather than let people through: an outage must not become an open door. The session is a signed cookie, eight hours, http-only; editing it to name another company breaks the signature."},{"title":"The contractor dashboard","risk":true,"primary":"The whole company's pulse in one screen, instead of five tools and a spreadsheet.","hoodSimple":"The dashboard reads the project data straight from the database, so there's no second copy of the numbers to keep in sync.","seconds":100,"screen":"dashboard","hotspot":"sec-projects-needing-attention","hover":"Four tiles across the top — Active contract value, Outstanding balance, Updates awaiting review, Needs attention. Sweep them, then rest on the \"Projects needing attention\" panel below.","say":"What your PM opens with coffee. The four tiles are the money and the queue. The panel underneath is the useful part — not a list of everything, a list of what has gone quiet or gone wrong.","watch":"THE NUMBERS ARE THIN AND YOU SHOULD SAY SO FIRST. The projects are real — read live from BuildSuite — but contract value and outstanding balance show a dash because BuildSuite does not hold them, and the review queue is empty because our tables are not created yet. Say \"the figures land when the tables go in\" BEFORE they read the dashes, not after.","then":"Point at the \"2\" badge on Field Updates in the sidebar. Then open Projects.","backend":"Live BuildSuite. This screen reads through our data layer, which prefers GoHighLevel custom objects when GHL_PROJECT_OBJECT_KEY is set, falls back to BuildSuite's Supabase — which is where it sits today — and only reaches fixtures when neither is reachable. So the projects, clients and dates are real. What is missing is everything that would live in our own tables: field updates, milestones, budgets. Those come back empty rather than invented.","ifAsked":[{"q":"Is this our real data?","a":"Yes — these are your projects, read out of BuildSuite a moment ago, and sign-in resolved your real account. What is not real is the empty half: no field updates, no budgets, because those live in tables your team has not signed off on yet. I would rather tell you than have you find it."}]},{"title":"The pipeline — and the number nobody wants","primary":"Every enquiry, by stage, with how long it has sat. Twenty-three deals and not one signed.","hoodSimple":"This reads the BuildSuite matching engine directly — the same table that decides which contractor gets a job. Nothing here is estimated or entered by hand.","seconds":110,"screen":"pipeline","hotspot":"sec-how-far-the-pipeline-gets","star":true,"hover":"Sweep the four tiles — Deals, Stalled, Dormant, Oldest. Then rest on \"How far the pipeline gets\" and stay there while you say the numbers.","say":"This is your funnel, live. Twenty-three enquiries. Sixteen are sitting at draft ready. Seventeen have not moved in over sixty days, and the oldest has sat for a hundred and seventy-four. Now the column on the right: matched to a contractor, zero. Proposal sent, zero. Signed, zero. Handed to GoHighLevel, zero. The build is not what is stuck — nothing has ever reached the point where the build starts.","watch":"DO NOT SOFTEN THIS AND DO NOT RUSH IT. It is the most valuable screen you have and the whole reason it exists is that these numbers were invisible until now. Say the zeros slowly. If it feels like bad news to deliver, that is the point — you found it, and you built the screen that shows it. Let the silence sit rather than filling it.","then":"Open Projects.","backend":"Read live from BuildSuite's `deals` table, tenant-scoped, read-only. The Hub had never read that table before this week — it read `projects`, which is the far end of the pipeline, so everything upstream was invisible. The stage bars are current occupancy, not cumulative flow, and the screen says so: a deal that advances leaves the count it came from. The right-hand column cuts across the stages instead, because a signed deal still carries whatever status it had.","ifAsked":[{"q":"Is that our real data, or a sample?","a":"Real, read out of BuildSuite about a second ago. The one caveat: roughly half of all deals carry no contractor profile, so a per-contractor count can only undercount. The screen states that itself at the bottom rather than presenting the number as complete."},{"q":"So the system does not work?","a":"The opposite — everything downstream of a signature is built and tested, and until this screen existed nobody could see that the funnel was empty. The blocker is one deal getting all the way through, and that is an operational run, not a build task."}]},{"title":"Projects — and whose they are","primary":"You see your jobs and nobody else's — enforced in the data, not hidden in the page.","hoodSimple":"Every request carries who you are, and the database only returns rows belonging to your company. Other contractors are in the same system and never appear here.","seconds":70,"screen":"projects","hotspot":"title","hover":"Down the project rows. Rest on Johnson Kitchen Remodel.","say":"Every job, one row each. And these are yours only. The database has other contractors in it; none of them appear here, and you do not appear in theirs.","watch":"One sentence on scoping, then move. Do not turn it into a security lecture.","then":"Click into Johnson Kitchen Remodel.","backend":"Every staff-side read takes a tenant as its first argument and will not compile without one. Not theoretical — in August the live database had 43 projects across five contractors visible to any signed-in user, and this is what fixed it. Two client-side reads deliberately take no tenant, because a homeowner may have jobs with more than one contractor; those are constrained by the gate instead."},{"title":"One project, one record","primary":"One record holds the whole job — including the money the client must never see.","hoodSimple":"Everything about a job lives on one record, so the crew, the office and the homeowner are all looking at the same source rather than their own copies.","seconds":90,"screen":"project","hotspot":"sec-financials","hover":"Five panels down the page — Timeline, Field updates, Financials, Client visibility, Assigned team. Rest on Financials.","say":"One record holds the whole job. Stage, updates, the crew, and the money — including your cost and your margin. Hold that thought, because it is why the next screen exists.","watch":"Do not rush past the margin figure and do not apologise for it being on screen. You are setting up the payoff.","then":"Scroll to the \"Client visibility\" panel and click \"Edit visibility →\"."},{"title":"Client Visibility Settings","primary":"You decide, switch by switch, what your homeowner is allowed to see — per project.","hoodSimple":"Each switch is stored on the project and checked every time the client portal builds a page. The preview panel runs the same check the real portal does, so it can't promise something the portal wouldn't do.","seconds":160,"screen":"visibility","hotspot":"sec-switches","star":true,"hover":"The Switches panel on the left. Then move right to \"What the client actually gets\".","say":"This is the screen nobody else has. Every switch is a decision about what your homeowner may see. Schedule on. Budget off. Photos on. Per project, not per company. And the panel on the right is not a description — it is the portal answering live. Flip a switch, save, it changes.","watch":"Actually toggle one and press \"Save visibility\". A screen you describe is a mockup; a screen you change in front of them is a product. Turn it back afterwards.","then":"Scroll to the \"Never visible\" panel.","backend":"Each switch is a field on the project record and a clause in the check that runs before any client response is assembled. The right-hand panel calls the same function the real portal calls, so it cannot show something the portal would not do.","ifAsked":[{"q":"Can we set defaults instead of doing this per job?","a":"Not yet — that is a settings screen we have not built. Per-project control had to be right first."}]},{"title":"What no switch can turn on","primary":"Cost, markup and margin have no switch at all — they're removed before the page is built.","hoodSimple":"For the sensitive fields we don't rely on a setting being off. We build the client's page from a named list of allowed fields, so anything not on that list can't appear even by mistake.","seconds":80,"screen":"visibility","hotspot":"sec-never-visible-whatever-the-switches-","star":true,"hover":"The panel headed \"Never visible, whatever the switches say\".","say":"Then there is this. Your cost, your markup, your margin, your internal notes, supplier invoices. There is no switch for these, because we did not build one. They are removed before the page is built, not hidden on it. Nobody can misconfigure their way into showing a client their margin.","watch":"Say \"we did not build a switch for it\", not \"it is disabled\". The absence is the point.","then":"Go to Field Updates in the sidebar.","backend":"Two mechanisms, and the difference is the point. The switches are a deny-list: things you can turn off. Costs and margin use an allow-list — we name the fields a client may receive and build the response from only those. Deny-lists fail open, so a field someone forgets gets exposed. Allow-lists fail closed: a new field is invisible until somebody deliberately allows it.","ifAsked":[{"q":"What about a cost-plus job where the client should see costs?","a":"Then that becomes a deliberate feature with its own control, not a switch sitting there waiting to be flipped by accident. Worth a conversation."}]},{"title":"The review queue","risk":true,"primary":"Nothing reaches your client until a human decides it should.","hoodSimple":"A field update arrives in a pending state. Nothing is sent to the homeowner until someone approves and publishes it.","seconds":70,"screen":"updates","hotspot":"title","hover":"The Field Updates heading and the empty review queue beneath it.","say":"Your superintendent files an update from their phone on site. It arrives here, and notice what has not happened: your client has not been told anything. Nothing moves to them until someone here decides it should.","watch":"THE QUEUE IS EMPTY AND YOU MUST SAY SO BEFORE THEY NOTICE. Field updates live in our own tables, which have not been created yet — that is the sign-off in the asks. So describe this step and the next two rather than clicking through them. Say: \"the rule is built and tested, what it needs is somewhere to store an update.\" Do not mime it and do not skip it — it is the most important argument you have.","then":"Describe the two boxes on an update card.","backend":"An update moves through a small state machine and the names matter: Pending, Approved Internally, Approved & Published. Only the last is visible to a client. Approved Internally reads like approval and deliberately is not."},{"title":"Two boxes — the argument","primary":"The crew writes what happened; the PM writes what the client reads. Same event, two audiences.","hoodSimple":"They're two separate fields on the record. Nothing copies the internal note into the client's version — which is why it can't leak later.","seconds":150,"screen":"updates","hotspot":"title","star":true,"hover":"The Field Updates screen. Describe the card rather than pointing at one — the queue is empty.","say":"Two boxes. The amber one is what the crew wrote — the tile came in wrong, the supplier let us down, we lost a day. The one below is what the client reads, and your PM edits it before it goes. Same event, two audiences. The crew never has to be diplomatic; the client never reads a raw complaint about a supplier.","watch":"This is where the call turns, and today you have to carry it with words — there is no card on screen to edit, because the Hub tables are not created yet. Say the two-audiences argument in full and slowly; it is the strongest thing in the product and it survives being described. Offer to show them the test that proves the internal note is never copied into the client field.","then":"Describe the four buttons.","backend":"Two separate fields on the record, not one field shown twice. No code path copies the internal note into the client summary. That is why the portal screen later can prove the complaint was not sent — it was never in the field that gets published.","ifAsked":[{"q":"Does the crew see what the PM changed?","a":"Not today. Fair ask, and the kind of thing we would add once you are using it."}]},{"title":"Four ways to answer","primary":"Approve internally is the button nobody else gives you — recorded, not reported.","hoodSimple":"Publishing runs a defined workflow rather than ad-hoc updates: it sets the status, notifies the client and stamps the date as one unit, so it can't half-happen.","seconds":80,"screen":"updates","hotspot":"title","hover":"Name the four choices a PM has on an update — Approve and Publish, Approve Internally, Edit Client Summary, Return for Revision.","say":"Four choices. Publish it and the client gets the edited version. Approve internally and it is on your record but the client never sees it. Edit the summary first. Or send it back to the crew. Most systems give you one button. The second one matters most — plenty of a day is worth recording and not worth reporting.","watch":"Name all four. The second one is the sale — sit on it. As above, there is nothing to click yet; say \"and that is the button nobody else gives you\" rather than reaching for a mouse.","then":"Switch to the client side.","backend":"Publishing runs a defined workflow, WF4, rather than updates scattered through a button handler. The workflow is a pure function: given this state, here are the effects — set the status, notify the contact, stamp the date. Something else carries them out, so we can test what a publish does without sending anyone a real notification, and an effect with no handler fails the build."},{"title":"Switch to their side","risk":true,"primary":"Same browser, other side of the gate — say out loud that this is a demo shortcut.","hoodSimple":"It swaps the signed-in view to the client's, keeping your real identity underneath so you can switch back. Real clients will get their own invited login.","seconds":55,"screen":"updates","hotspot":"switcher","star":true,"hover":"Top right of the header — \"Viewing as Contractor\". Click it, choose Client Portal.","say":"Now I am going to become your customer. Same browser, other side of the gate.","watch":"An orange bar appears saying you are viewing as someone else. Point at it and say it before they ask: this is a demo shortcut so I can show both sides in one sitting, and your homeowner gets their own login by email invitation. Announced, it reads as considered. Discovered, it reads as a hole.","then":"Land on the client portal.","backend":"It rewrites and re-signs the session cookie, keeping your real identity inside so the return trip is exact. Two guards: the field view inherits your own tenant keys and never the demo account's, or a switch would show you another agency's jobs; and the client view carries no tenant key at all, because a client is scoped through their contact record.","ifAsked":[{"q":"So a contractor can log in as their client?","a":"Only in this demo build, so I can show you both views in one call. Real clients get their own invitation and password — that is the next thing we build."}]},{"title":"Thirteen screens","primary":"Thirteen screens — this is the client portal you asked to see last time.","hoodSimple":"Every nav item is a real route; two of them are designed placeholders and I'll show you one.","seconds":100,"screen":"portal","hotspot":"nav-completion-warranty","star":true,"hover":"Run slowly down the whole left nav — all thirteen, ending on Completion & Warranty. Say nothing until you reach the bottom.","say":"Thirteen screens. Timeline, schedule, daily updates, designs, budget, change orders, documents, photos, messages, issues, payments, completion. This is what we got wrong last time — not the thinking, the order we showed it in. You asked to see a client portal and we showed you a database.","watch":"Slow down here. Let the list be seen before you talk over it. This step exists to repair one specific impression: that we had built less than we had.","then":"Move to the top of the page."},{"title":"Their project, their language","primary":"Your nineteen pipeline stages become plain English for the homeowner.","hoodSimple":"The same project record is translated for the client: your detailed stages collapse into a handful they'd actually understand.","seconds":90,"screen":"portal","hotspot":"sidebar","hover":"The client sidebar — thirteen sections. Run down them.","say":"Their job, in their words. Where it is now, what needs them next, what is coming. Your pipeline has nineteen stages because running a job takes nineteen. They see the one that matters, in plain English. Same record, translated.","watch":"THE CLIENT PORTAL HAS NO CONTENT TODAY. Records for the homeowner live in the Hub tables, which are not created yet, so these screens render their empty state. What is real and worth showing is the navigation — thirteen sections, the shape of the whole product. Say what each screen will hold and why the rule behind it matters; do not pretend to read rows. There are two Johnson projects in the switcher at the top — a homeowner can have more than one job with you. Worth a sentence if they notice it.","then":"Open Daily Updates in the nav.","backend":"Nineteen stages collapse to six for the client via a lookup table; an unrecognised stage falls back to Planning rather than throwing. A client seeing a slightly early stage is confusing; a crashed page is worse. The six are our reading, not something anyone confirmed — worth asking them.","ifAsked":[{"q":"Can we change what the stages are called?","a":"Yes, and we would rather you did. Tell us what a homeowner should see and we will map it."}]},{"title":"The same update, transformed","primary":"The supplier complaint isn't hidden here — it was never sent.","hoodSimple":"Before this page is built we check the portal is on, the item is marked client-visible, it's been published, and this homeowner owns the project. Then internal fields are stripped from what's left.","seconds":110,"screen":"portalUpdates","hotspot":"sidebar","star":true,"hover":"The Daily Updates screen. Describe the published entry rather than pointing at one.","say":"There it is. The update we approved a minute ago, in the clean version your PM wrote. Now tell me where the supplier complaint went. It is not further down and it is not hidden behind anything. It was never sent.","watch":"THE CLIENT PORTAL HAS NO CONTENT TODAY. Records for the homeowner live in the Hub tables, which are not created yet, so these screens render their empty state. What is real and worth showing is the navigation — thirteen sections, the shape of the whole product. Say what each screen will hold and why the rule behind it matters; do not pretend to read rows. This is the closing argument. Pause after \"it was never sent\" and let them fill the silence.","then":"Open Documents.","backend":"Four checks ran before this response was built: is the portal on for this project, is the item client-visible, is it in a published state, does this contact own this project. First failure wins. Then internal fields are stripped from what is left. It happens where the data is read, so no page, no API call and no browser trick returns the internal note."},{"title":"Documents — proof by absence","risk":true,"primary":"The list is short on purpose — that's the feature, not a gap.","hoodSimple":"Nothing is visible unless it's explicitly marked visible, so a document uploaded and never reviewed can't reach a client by sitting there.","seconds":100,"screen":"portalDocuments","hotspot":"sidebar","star":true,"hover":"The Document Center. Describe the rule; there are no rows to count today.","say":"Five documents here. There are six on the project. The missing one is a supplier invoice, marked internal. A list that showed you everything would prove nothing — this one is short on purpose, and that is the feature.","watch":"THE CLIENT PORTAL HAS NO CONTENT TODAY. Records for the homeowner live in the Hub tables, which are not created yet, so these screens render their empty state. What is real and worth showing is the navigation — thirteen sections, the shape of the whole product. Say what each screen will hold and why the rule behind it matters; do not pretend to read rows. Count the rows on screen before the call and use the real number, or describe the shape and skip the figures. Documents live in our own tables, which are not created yet, so this list may be empty — in which case describe the rule and do not point at rows.","then":"Click Photos & Videos.","backend":"Default-deny. An item is invisible unless something explicitly marks it visible, so a document uploaded and never reviewed does not reach a client by sitting there. The failure mode is a homeowner asking why they cannot see something, which is a phone call. The other way round is a leak."},{"title":"Photos, and the one held back","primary":"You decide when a problem becomes a conversation — not the system.","hoodSimple":"Same rule as documents: the crew shoots everything, the client sees what's been approved.","seconds":70,"screen":"portalPhotos","hotspot":"sidebar","hover":"The Photos screen.","say":"Same rule. Three photos published, four on the job. The held-back one is a scratched door with a replacement already ordered — your call whether that is a conversation you want before it is fixed, rather than the system deciding for you.","watch":"THE CLIENT PORTAL HAS NO CONTENT TODAY. Records for the homeowner live in the Hub tables, which are not created yet, so these screens render their empty state. What is real and worth showing is the navigation — thirteen sections, the shape of the whole product. Say what each screen will hold and why the rule behind it matters; do not pretend to read rows. Keep it short. You have made the argument; this is confirmation.","then":"Click Designs & Selections."},{"title":"What is not built yet","risk":true,"primary":"Show them a gap before they find one — it buys more trust than a flawless pitch.","hoodSimple":"One real route with the design in place, waiting on a decision rather than on us. A client clicking a dead link concludes the product is broken; this tells them what's coming.","seconds":85,"screen":"portal","hotspot":"nav-payments","star":true,"hover":"The Payments nav item. Do not click away quickly.","say":"Straight with you on this one. Payments is designed and not built — it is in the navigation because your client should see what is coming rather than hit a dead end. It stays unbuilt on purpose until you tell me whether payments run through GoHighLevel's own invoicing or through Stripe, because building it against the wrong one throws the work away. Everything else in this list is real.","watch":"Do not skip this and do not rush it. You lost trust by them finding a gap themselves; you get it back by showing them one first. Only give the two-week estimate if you can stand behind it.","then":"Switch back to your account. Narrow the window, then go to the field view.","ifAsked":[{"q":"Why show them at all if they are empty?","a":"The alternative is a homeowner clicking a link, getting nothing, and deciding the product is broken. The demo you liked does the same on its warranty screen."}]},{"title":"The field interface","primary":"Thirty seconds on a phone in a driveway — and the same two boxes from the other end.","hoodSimple":"Submitting notifies the project manager and never the client. There's no path from the crew's phone to your homeowner.","seconds":90,"screen":"field","hotspot":"sec-my-projects","hover":"Narrow the browser to phone width FIRST. Then: Today's tasks, the \"Add daily update\" form, and \"Submit to Project Manager\" at the bottom.","say":"The crew, on a phone, in a driveway. Big targets, few fields, thirty seconds to file. And the same two boxes from the other end: what happened, and what the client should hear. The crew writes both, your PM decides. That is the loop.","watch":"Resize before you switch, not after. Watching a desktop layout squeeze down live looks unfinished.","then":"Stop navigating. Move to the close.","backend":"Submitting runs WF3, which notifies the project manager and never the client. There is no code path from a field submission to a client notification. The only route to a homeowner is a PM pressing publish."},{"title":"What is live, what is not","risk":true,"primary":"Be blunt about what's real. It decides whether they believe everything else.","hoodSimple":"Sign-in and this screen read your live systems. The rest runs on sample content until our tables are created in your database.","seconds":110,"screen":"buildsuite","hotspot":"sec-active-projects","star":true,"hover":"Open \"From BuildSuite\" in the sidebar. This one IS your live data — show it.","say":"Where this stands, bluntly. Sign-in through GoHighLevel is real, against your live account. This screen is reading your real BuildSuite database — those projects started as leads in GoHighLevel, went into BuildSuite to be bid, and we read them back out. Everything you saw today read from that same live database — what was thin was the half that needs our own tables, and I flagged it each time rather than dressing it up. That is one configuration value and your team's sign-off on our tables, not a gap in the build.","watch":"Say this even if nobody asks — it decides whether they believe the rest. Ending here is deliberate: finish on the screen where the data is unambiguous.","then":"Go into the asks.","backend":"Next.js on Vercel, reading BuildSuite's Supabase read-only and GoHighLevel over its API. Our own tables are written and not yet created — that is the sign-off. Automated tests in the high hundreds, and the ones that matter assert the rules rather than the screens."},{"title":"The two asks","primary":"Two asks, not five. A short list reads as a project waiting on a decision.","hoodSimple":"We need the client stages confirmed by someone who runs jobs, and their team to create our tables.","seconds":100,"screen":"buildsuite","hover":"Nothing on screen. Have the two asks written down in front of you.","say":"Two things from you. First: are those six client stages the right six? You run these jobs, we do not. Second: we need your team to create the Hub tables in the database. We have written the change and we will not run it ourselves on a live system. Give us those and the four remaining screens land next.","watch":"Two asks, not five. Listing everything you are blocked on reads as a project in trouble rather than one waiting on a decision. The BuildSuite-side dependencies are NOT asks — keep them in the annex.","then":"Ask for the next meeting."},{"title":"Close","primary":"Concede the last meeting in one sentence, then ask for the next thing.","hoodSimple":"Ask for time with whoever runs jobs day to day.","seconds":50,"screen":"buildsuite","hover":"Stop the screen share before the goodbyes, not after.","say":"Last thing. You told us this felt backward, and you were right about what we showed you. What you saw today is what we had built, in the order it should have been shown. Can we get thirty minutes with whoever runs your jobs day to day, so the next version is shaped by them rather than by us guessing?","watch":"Concede in one sentence, name what changed, ask for the next thing. Do not relitigate the last meeting.","then":"Stop sharing. Follow up within the hour, while they still remember the two boxes."},{"title":"How the three systems fit","primary":"A loop, not a line — and we're reading the far end of their own pipeline.","hoodSimple":"Leads start in GoHighLevel, cross into BuildSuite to be bid, and hand back to GoHighLevel at signing. The Hub sits on top of all three.","seconds":100,"screen":"systems","hotspot":"inbound","section":"annex","hover":"The inbound arrow first, then the handoff, then the sync-back.","say":"A loop, not a line. Leads land in GoHighLevel — your CRM, contacts, messaging. They cross into BuildSuite to be estimated and bid. When one signs, it hands back to GoHighLevel, which owns the job from then on. The Hub is the operational layer on top. The projects you saw came out of BuildSuite, and BuildSuite got them from GoHighLevel. We are reading the far end of your own pipeline.","watch":"Get the direction right — GoHighLevel into BuildSuite first, then back at signing. Backwards makes it sound like we do not know where their data lives.","then":"Back to wherever you jumped in from.","backend":"The signing handoff is once and one-directional. Two systems writing the same operational records is how you get a project in two states with no way to say which is right. Everything joins on one key, the BuildSuite project id — never a name, address or email, because those get edited."},{"title":"Where the data lives","primary":"We hold nothing they can't see, and we haven't touched their database.","hoodSimple":"Contacts and messaging stay in GoHighLevel, estimates in BuildSuite. Our own tables are written and waiting for their team to create them.","seconds":90,"screen":"stack","hotspot":"data","section":"annex","hover":"The layers, bottom to top.","say":"Three stores. GoHighLevel holds contacts, the pipeline and messaging. BuildSuite holds estimates and the project record. Our own operational tables — updates, approvals, visibility — are written and waiting on your team to create them. We hold nothing you cannot see.","then":"Back to wherever you jumped in from.","backend":"Eight new tables, all prefixed hub_, create-only: no ALTER, no DROP, nothing of BuildSuite's touched. RLS enabled deny-by-default on every one, and both tenancy keys on every row, so a row cannot be read without knowing whose it is. Not run: the app's key cannot execute DDL, which is correct — a running application should never be able to change its own schema. It needs the service role and Sing's sign-off, since it is his database."},{"title":"Why the gate is not a UI rule","primary":"It was never sent to their browser — not merely hidden in the page.","hoodSimple":"Most systems hide sensitive fields in the page, where a curious person can still find them. We remove them one layer below every screen, so they never leave the server.","seconds":90,"screen":"stack","hotspot":"gate","section":"annex","star":true,"hover":"The gate layer in the middle.","say":"The usual way to build this is to hide things in the page. We do it where the data is read, one layer below every screen. So there is no page, no export, no API call and no browser trick that returns what the gate removed. It is not that the client cannot see it — it was never sent to their browser.","then":"Back to wherever you jumped in from.","backend":"Four clauses, first failure wins, then internal fields are stripped from what survives. Anywhere that assembles a client response without calling both is a defect even if the UI happens to hide it — that rule is in the repo's contributing notes, with tests asserting it."},{"title":"How one agency cannot see another","primary":"Code that forgets to scope a query doesn't build.","hoodSimple":"Every request carries who you are, and reads that don't include it fail at build time rather than quietly returning everyone's data.","seconds":80,"screen":"stack","hotspot":"data","section":"annex","hover":"The data layer.","say":"Every staff-side read takes the tenant as its first argument and will not compile without one. Not a filter someone remembers to add — code that forgets it does not build.","watch":"If they ask whether this was ever wrong: yes, and say so. In August we found 43 projects across five contractors visible to any signed-in user. Finding it is the reason it is now structural.","then":"Back to wherever you jumped in from.","backend":"The tenant is the GoHighLevel sub-account, matching how BuildSuite works. One location maps to several BuildSuite profiles — the live Alliance account has two admin profiles owning nine projects between them, so scoping to one would have hidden half an agency's work from itself."},{"title":"When something breaks","primary":"An outage must never become an open door.","hoodSimple":"If GoHighLevel can't be reached at sign-in we refuse rather than guess. If our app is down, their other systems carry on — nothing is stored only with us.","seconds":80,"screen":"systems","hotspot":"hub","section":"annex","hover":"The Project Hub box.","say":"If GoHighLevel is unreachable at sign-in, we refuse rather than let people in — an outage must not become an open door. If our app is down, GoHighLevel and BuildSuite carry on; nothing depends on us to keep working, and nothing is stored only here.","then":"Back to wherever you jumped in from.","backend":"Auth failures are classified rather than lumped together: an unknown sub-account, a bad credential of ours, and GoHighLevel being unreachable produce three different messages, because they need three different fixes. Measured against the live API — an unreachable location returns 403, not 404, which we had wrong at first, and it sent people off to check their wifi."},{"title":"What is left","risk":true,"primary":"The known gaps, said the same way whether they ask or not.","hoodSimple":"One portal screen, the front door for the client link, the field login, our tables, and multi-company sign-in before the second client.","seconds":100,"screen":"stack","section":"annex","hover":"Nothing. Eye contact.","say":"One portal screen designed and not built: payments, and that one is waiting on your answer about the rail. The client sign-in link itself is built — single use, it expires, and an email address plus a project number on its own gets nobody in. What is not built is the branded page that sends it, because where that page lives is your call. The field login is not built. Our tables need creating in your database. Multi-tenant sign-in needs a GoHighLevel Marketplace app before the second client, not after. Two more things we are waiting on from the BuildSuite side. Everything else is real.","watch":"Say this list the same way whether asked or not. Do not name individuals to the client — \"the BuildSuite side\" is enough. If he asks whether a homeowner can log in today: the mechanism works, the page that emails the link does not.","then":"Go to the two dependencies.","backend":"Payments is a placeholder with a design behind it, not a missing route, so the nav stays honest about what is coming. Client sign-in is a signed single-use token and a /verify landing that mints the same session the contractor path does; the gap is the branded front door and the email send, plus his confirmation that the link — not the project number — is the credential. Multi-tenant is the real dependency: the token we authenticate with is scoped to one sub-account, so a second client needs the Marketplace app."},{"title":"The two we are waiting on","risk":true,"primary":"These decide which projects appear — and they're owed by another team, not by us.","hoodSimple":"We're showing every project on the account because we can't yet tell which deals were actually won. That needs two pieces from the BuildSuite side.","seconds":110,"screen":"systems","hotspot":"inbound","section":"annex","star":true,"hover":"The inbound arrow — leads coming into BuildSuite from GoHighLevel.","say":"Two open dependencies, both on the BuildSuite side, both about which projects we show rather than how. First, the list reads every project BuildSuite holds for the account; it should show only closed, signed work, and that needs the client-to-contractor matching finished before we can filter on it. Second, we cannot find how a contractor bid is classified in the data, so we cannot yet tell a won bid from an open one. Neither blocks a screen. Both decide what the list contains.","watch":"INTERNAL — do not say these names to the client: the matching is Sing's, and the bid classification is the one Pat set up that we cannot locate in the schema. Externally: \"the BuildSuite side\" and \"how bids are classified\".\n\nKeep these out of the two asks. Those are the client's decisions; these are things another team owes us.","then":"Back to wherever you jumped in from.","backend":"We read projects for the account filtered on active status, with no notion of \"this deal was won\". Until the matching lands there is no reliable join from a contractor to the client whose deal they closed, so \"only closed deals\" cannot be expressed as a query. We have been through the columns and cannot find the field or value marking a bid as won, so any filter would be a guess.","ifAsked":[{"q":"So the dashboard numbers are wrong?","a":"They are that account's, but the list is broader than it should be — it includes work that is not signed yet. Narrowing it is a filter we are waiting on, not a rebuild."}]}];

1,3],"row":[14,1]},{"id":"nav-completion-warranty","label":"Completion & Warranty","kind":"nav","col":[1,3],"row":[15,1]}]},"field":{"name":"Field Interface","route":"/field","rows":14,"blocks":[{"id":"banner","label":"data banner","kind":"header","col":[1,12],"row":[1,1]},{"id":"context","label":"header","kind":"header","col":[4,6],"row":[2,1]},{"id":"title","label":"Today's tasks","kind":"header","col":[4,6],"row":[3,1]},{"id":"sec-my-projects","label":"My projects","kind":"panel","col":[4,6],"row":[4,2]}]},"systems":{"name":"How the three systems fit","route":"GoHighLevel -> BuildSuite -> back at signing -> Project Hub","rows":14,"blocks":[{"id":"ghl","label":"GoHighLevel — leads, CRM","kind":"panel","col":[1,4],"row":[2,3]},{"id":"buildsuite","label":"BuildSuite — estimating","kind":"panel","col":[5,4],"row":[2,3]},{"id":"hub","label":"Project Hub","kind":"button","col":[9,4],"row":[2,3]},{"id":"inbound","label":"leads in, deals get bid","kind":"row","col":[1,8],"row":[6,1]},{"id":"handoff","label":"hands back at signing","kind":"row","col":[3,9],"row":[7,1]},{"id":"syncback","label":"stage sync-back, read-only","kind":"row","col":[5,8],"row":[8,1]},{"id":"supabase","label":"Supabase — BuildSuite's","kind":"panel","col":[1,6],"row":[10,2]},{"id":"hubtables","label":"hub_ tables — not yet created","kind":"panel","col":[7,6],"row":[10,2]},{"id":"browsers","label":"Contractor    Field    Client","kind":"sidebar","col":[1,12],"row":[13,2]}]},"stack":{"name":"What sits between a client and the data","route":"screens -> the gate -> data layer -> sources","rows":14,"blocks":[{"id":"ui","label":"Screens","kind":"panel","col":[2,10],"row":[2,2]},{"id":"gate","label":"The gate: 4 checks, then strip internals","kind":"button","col":[2,10],"row":[5,3]},{"id":"data","label":"Data layer — every staff read needs a tenant","kind":"panel","col":[2,10],"row":[9,2]},{"id":"src-1","label":"Supabase","kind":"row","col":[2,5],"row":[12,2]},{"id":"src-2","label":"GoHighLevel API","kind":"row","col":[7,5],"row":[12,2]}]}};
const TITLE = "BuildSuite Project Hub";
const WALK = STEPS.filter(s => s.section !== 'annex');
const PLANNED = WALK.reduce((a,s) => a + s.seconds, 0);

let cur = 0, mode = 'full', elapsed = 0, running = false, ticker = null;
const done = new Set();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = n => Math.floor(n/60) + ':' + String(n%60).padStart(2,'0');
const human = n => n < 60 ? n + ' sec' : (Number.isInteger(n/60) ? n/60 + ' min' : (n/60).toFixed(1) + ' min');
const walkIndex = i => STEPS.slice(0, i+1).filter(s => s.section !== 'annex').length;
const plannedBy = i => STEPS.slice(0, i+1).filter(s => s.section !== 'annex').reduce((a,s) => a + s.seconds, 0);

const I = {
  warn:'<svg viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  mouse:'<svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg>',
  then:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
};

/* ── sequence ── */
function seqHTML(){
  let html = '', lastSection = null;
  STEPS.forEach((s,i) => {
    const section = s.section === 'annex' ? 'annex' : 'walk';
    if (section !== lastSection) {
      html += '<div class="seqgroup">' + (section === 'annex' ? 'Annex \u00b7 only if asked' : 'Walkthrough') + '</div>';
      lastSection = section;
    }
    const cls = ['step'];
    if (i === cur) cls.push('active');
    else if (done.has(i)) cls.push('done');
    const num = s.section === 'annex' ? 'A' + (STEPS.slice(0,i+1).filter(x=>x.section==='annex').length)
                                      : String(walkIndex(i)).padStart(2,'0');
    const flag = s.risk ? '<span class="flag">' + I.warn + '</span>'
               : s.star ? '<span class="star">\u2605</span>' : '<span></span>';
    html += '<button class="' + cls.join(' ') + '" data-i="' + i + '">' +
            '<span class="num">' + num + '</span>' +
            '<span class="lbl">' + esc(s.title) + '</span>' + flag + '</button>';
  });
  return html;
}

/* ── the mini app ── */
function appHTML(step){
  const screen = SCREENS[step.screen];
  const blocks = screen.blocks;
  const avoid = new Set(step.avoid || []);
  const mark = b => (b.id === step.hotspot ? ' hl' : (avoid.has(b.id) ? ' avoid' : ''));
  const tip = b => (b.id === step.hotspot ? ' data-tip="point here"' : '');

  const nav = blocks.filter(b => b.kind === 'nav');
  const title = blocks.find(b => b.id === 'title');
  const panels = blocks.filter(b => b.kind === 'panel' || b.kind === 'row' || b.kind === 'tile' || b.kind === 'hero');
  const btns = blocks.filter(b => b.kind === 'button' && b.id !== 'switcher');
  const switcher = blocks.find(b => b.id === 'switcher');

  let side = '';
  if (nav.length) {
    side = '<div class="aside"><div class="abrand">Build<span>Suite</span></div>' +
      nav.map(b => '<div class="anav' + mark(b) + '"' + tip(b) + '><span class="b"></span>' + esc(b.label || '') + '</div>').join('') +
      '</div>';
  }

  let body = '';
  if (switcher) {
    body += '<div style="display:flex;justify-content:flex-end;margin-bottom:9px">' +
            '<span class="abtn' + mark(switcher) + '"' + tip(switcher) + '>' + esc(switcher.label) + ' \u25be</span></div>';
  }
  if (title) body += '<div class="atitle' + mark(title) + '"' + tip(title) + '>' + esc(title.label || '') + '</div>';
  if (panels.length) {
    const cols = panels.length >= 4 ? 2 : 1;
    body += '<div class="acards" style="grid-template-columns:repeat(' + cols + ',1fr)">' +
      panels.map(b => '<div class="acard' + mark(b) + '"' + tip(b) + '>' +
        '<div class="cl">' + esc((b.label || 'section').slice(0,34)) + '</div>' +
        '<div class="cv">\u2014</div></div>').join('') + '</div>';
  }
  if (btns.length) {
    body += '<div class="abtns">' + btns.map(b =>
      '<span class="abtn' + mark(b) + '"' + tip(b) + '>' + esc(b.label || '') + '</span>').join('') + '</div>';
  }

  return '<div class="app' + (nav.length ? '' : ' nosidebar') + '">' + side +
         '<div class="abody">' + body + '</div></div>';
}

/* ── main panel ── */
function mainHTML(){
  const s = STEPS[cur];
  const screen = SCREENS[s.screen];
  const isAnnex = s.section === 'annex';
  let h = '';

  h += '<div class="stephead"><div><div class="of">' +
       (isAnnex ? 'Annex \u00b7 only if asked' : 'Step ' + walkIndex(cur) + ' of ' + WALK.length) +
       (s.risk ? ' \u00b7 handle with care' : '') + '</div>' +
       '<h1 class="title">' + esc(s.title) + (s.star ? ' <span class="star">\u2605</span>' : '') + '</h1></div>' +
       '<div class="time">\u23f1 <b>' + human(s.seconds) + '</b></div></div>';

  h += '<div class="primary"><span class="k">Primary message</span><span class="v">' + esc(s.primary) + '</span></div>';

  // Left column: the picture. Right column: everything you say.
  h += '<div class="cols"><div class="colL">';

  h += '<div class="sec view-tag"><div class="label"><span class="tag">System view \u2014 what to show</span><span class="rule"></span></div>' +
       '<div class="viewport"><div class="vchrome"><span class="tl"><i></i><i></i><i></i></span>' +
       '<span class="url">' + esc(screen.route) + '</span></div>' + appHTML(s) + '</div>' +
       '<div class="route"><span class="rk">Screen</span><span class="rv">' + esc(screen.name) + '</span></div></div>';

  h += '</div><div class="colR">';

  h += '<div class="mouse"><div class="ico">' + I.mouse + '</div><div><div class="mh">Put the mouse here</div>' +
       '<p>' + esc(s.hover) + '</p></div></div>';

  h += '<div class="say"><div class="sl"><span class="tag">Say</span><span class="rule"></span></div>' +
       '<p>' + esc(s.say) + '</p></div>';

  if (s.watch) {
    const items = s.watch.split('\n\n').filter(Boolean);
    h += '<div class="watch"><div class="wl">' + I.warn + ' Watch out</div><ul>' +
         items.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul></div>';
  }

  if (s.hoodSimple || s.backend) {
    h += '<div class="sec hoodsec"><details class="hood"><summary>' +
      '<span class="tag">Under the hood \u2014 only if asked</span><span class="hint">click to open</span></summary>' +
      '<div class="hoodbody">' +
      (s.hoodSimple ? '<div class="simple"><div class="q">Simple answer</div><div class="a">' + esc(s.hoodSimple) + '</div></div>' : '') +
      (s.backend ? '<div><div class="q">Technical answer</div><div class="a">' + esc(s.backend) + '</div></div>' : '') +
      '</div></details></div>';
  }

  if (s.ifAsked && s.ifAsked.length) {
    h += '<div class="sec asksec"><div class="ask"><div class="label" style="margin-bottom:10px">' +
      '<span class="tag">If they ask</span><span class="rule"></span></div>' +
      s.ifAsked.map(a => '<div class="qitem"><div class="qq"><span class="m">Q</span>' + esc(a.q) + '</div>' +
        '<div class="qa">' + esc(a.a) + '</div></div>').join('') + '</div></div>';
  }

  h += '<div class="then"><div class="ico">' + I.then + '</div><div><div class="tl">Then</div>' +
       '<p>' + esc(s.then) + '</p></div></div>';

  h += '</div></div>';

  return h;
}

function render(){
  $('seq').innerHTML = seqHTML();
  for (const b of $('seq').querySelectorAll('.step')) b.onclick = () => jump(Number(b.dataset.i));
  $('main').innerHTML = mainHTML();
  const w = walkIndex(cur), isAnnex = STEPS[cur].section === 'annex';
  $('count').textContent = isAnnex ? 'annex' : String(w).padStart(2,'0') + ' / ' + WALK.length;
  $('pbar').style.width = ((isAnnex ? WALK.length : w) / WALK.length * 100) + '%';
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === STEPS.length - 1;
  const nxt = STEPS[cur+1];
  $('nextup').innerHTML = nxt ? 'Next up \u00b7 <b>' + esc(nxt.title) + '</b>' : 'Final step';
  drawClock();
  window.scrollTo(0,0);
}
function drawClock(){
  const behind = running && elapsed > plannedBy(cur) + 60;
  $('clock').className = 'clock' + (behind ? ' behind' : '');
  $('clock').innerHTML = '\u23f1 <b>' + clock(elapsed) + '</b> / ' + clock(PLANNED);
}
function jump(i){ done.add(cur); cur = Math.max(0, Math.min(STEPS.length-1, i)); location.hash = String(cur); render(); }
function go(d){ jump(cur + d); }
function setMode(m){
  mode = m;
  document.body.classList.toggle('presenter', m === 'presenter');
  $('mFull').classList.toggle('on', m === 'full');
  $('mPres').classList.toggle('on', m === 'presenter');
}
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('mFull').onclick = () => setMode('full');
$('mPres').onclick = () => setMode('presenter');
$('clock').onclick = () => {
  running = !running;
  clearInterval(ticker);
  if (running) ticker = setInterval(() => { elapsed++; drawClock(); }, 1000);
  drawClock();
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  else if (e.key.toLowerCase() === 'p') setMode(mode === 'full' ? 'presenter' : 'full');
  else if (e.key.toLowerCase() === 't') $('clock').click();
});

/* paper backup */
$('print-body').innerHTML = '<h1>' + esc(TITLE) + '</h1>' + STEPS.map((s,i) =>
  '<div class="stp"><h2>' + (s.section === 'annex' ? 'Annex' : walkIndex(i)) + '. ' + esc(s.title) + (s.star ? ' \u2605' : '') + '</h2>' +
  '<p class="m">' + human(s.seconds) + ' \u00b7 ' + esc(SCREENS[s.screen].name) + '</p>' +
  '<p><span class="k">Primary</span> ' + esc(s.primary) + '</p>' +
  '<p><span class="k">Hover</span> ' + esc(s.hover) + '</p>' +
  (s.watch ? '<p><span class="k">Watch</span> ' + esc(s.watch.replace(/\n\n/g,' ')) + '</p>' : '') +
  '<p><span class="k">Say</span> ' + esc(s.say) + '</p>' +
  (s.ifAsked ? s.ifAsked.map(a => '<p><span class="k">If asked</span> ' + esc(a.q) + ' \u2014 ' + esc(a.a) + '</p>').join('') : '') +
  '<p><span class="k">Then</span> ' + esc(s.then) + '</p></div>').join('');

const fromHash = parseInt(location.hash.replace('#',''), 10);
if (Number.isInteger(fromHash)) cur = Math.max(0, Math.min(STEPS.length-1, fromHash));
render();

</script>
