<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BuildSuite Project Hub — Demo HUD</title>
<style>
:root {
  --bg: #080d16;
  --panel: #0e1626;
  --panel-2: #0b1220;
  --line: #1e2b41;
  --text: #dbe4f0;
  --muted: #6b7f9e;
  --dim: #445573;
  --blue: #2563eb;
  --blue-text: #60a5fa;
  --amber: #f59e0b;
  --green: #34d399;
  --violet: #a78bfa;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

.app { display: flex; flex-direction: column; height: 100%; }

/* ── Header ─────────────────────────────────────────────────────────────── */
header {
  display: flex; align-items: center; gap: 16px;
  flex-shrink: 0;
  padding: 10px 20px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
}
header h1 { margin: 0; font-size: 14px; font-weight: 600; color: #fff; }
header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.spacer { margin-left: auto; }

.clock {
  font-variant-numeric: tabular-nums;
  font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
  font-size: 14px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
}
.clock.behind { border-color: rgba(245,158,11,.6); background: rgba(245,158,11,.1); color: var(--amber); }
.clock .total { color: var(--dim); font-size: 12px; margin-left: 6px; }

button {
  font: inherit;
  cursor: pointer;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  padding: 5px 11px;
  font-size: 13px;
  transition: background .12s;
}
button:hover:not(:disabled) { background: #17243a; }
button:disabled { opacity: .3; cursor: default; }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 500; }
button.primary:hover:not(:disabled) { background: #3b82f6; }
button.ghost { border-color: transparent; color: var(--dim); }
button.ghost:hover { color: var(--text); background: transparent; }

/* ── Body ───────────────────────────────────────────────────────────────── */
.body { display: flex; flex: 1; min-height: 0; }

aside {
  width: 320px; flex-shrink: 0;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line);
  overflow-y: auto;
}

.label {
  font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
}

.map-wrap { flex-shrink: 0; padding: 14px; border-bottom: 1px solid var(--line); }
.map-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.map-head .screen-name { font-size: 10px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.map {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  /* row count is set per screen from JS */
  gap: 2px;
  aspect-ratio: 15 / 11;
  padding: 4px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.blk {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  border-radius: 2px;
  padding: 0 3px;
  background: #16223a;
  opacity: .6;
}
.blk .t {
  font-size: 7px; line-height: 1; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.blk.sidebar, .blk.panel, .blk.hero { background: #131e33; }
.blk.button { background: #22314e; }
.blk.lit {
  background: var(--amber);
  box-shadow: 0 0 0 2px #fcd34d;
  opacity: 1;
  z-index: 2;
  animation: pulse 1.8s ease-in-out infinite;
}
.blk.lit .t { color: #1c1206; font-weight: 600; }
.blk .num {
  position: absolute; top: -4px; left: -4px;
  width: 15px; height: 15px; border-radius: 50%;
  background: #fcd34d; color: #1c1206;
  font-size: 8px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 2px #fcd34d; } 50% { box-shadow: 0 0 0 5px rgba(252,211,77,.3); } }

.route { margin: 8px 0 0; font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: var(--dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

nav { flex: 1; padding: 8px; }
.step-btn {
  display: flex; align-items: flex-start; gap: 8px;
  width: 100%; text-align: left;
  border: none; background: transparent;
  padding: 6px 8px; border-radius: 4px;
  font-size: 12.5px; color: var(--muted);
}
.step-btn:hover { background: #131e33; }
.step-btn .n { width: 16px; flex-shrink: 0; text-align: right; font-family: ui-monospace, Consolas, monospace;
  font-size: 10px; color: var(--dim); }
.step-btn .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step-btn.done { color: var(--dim); }
.step-btn.active { background: var(--blue); color: #fff; font-weight: 500; }
.step-btn.active .n { color: #bfdbfe; }
.star { color: rgba(245,158,11,.75); }
.step-btn.active .star { color: #fcd34d; }

/* ── Step detail ────────────────────────────────────────────────────────── */
main { flex: 1; min-width: 0; overflow-y: auto; }
.detail { max-width: 760px; padding: 24px 26px 40px; }
.detail h2 { margin: 4px 0 0; font-size: 27px; font-weight: 600; color: #fff; letter-spacing: -.01em; }
.detail h2 .star { font-size: 19px; vertical-align: super; }
.dur { margin-top: 5px; font-size: 12px; color: var(--muted); }

.box {
  display: flex; gap: 12px;
  margin-top: 16px; padding: 15px 16px;
  background: var(--panel-2);
  border-radius: 6px;
}
.bar { width: 3px; flex-shrink: 0; border-radius: 2px; }
.box .label { margin-bottom: 6px; }
.box p { margin: 0; line-height: 1.6; }
.box.hover .bar { background: var(--green); } .box.hover .label { color: var(--green); }
.box.watch .bar { background: var(--amber); } .box.watch .label { color: var(--amber); }
.box.say   .bar { background: var(--blue); }  .box.say .label   { color: var(--blue-text); }
.box.backend .bar { background: var(--violet); } .box.backend .label { color: var(--violet); }
.box.say p { font-size: 16px; color: #f1f5f9; }
.box.hover p, .box.watch p { font-size: 14px; color: #c3cfe0; }
/* Quieter than Say on purpose — reference material, not the script. */
.box.backend p { font-size: 13.5px; color: #9aa9bf; }

.annex-head {
  margin: 12px 0 4px; padding: 10px 8px 0;
  border-top: 1px solid var(--line);
  font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--dim);
}
.annex-tag { color: var(--violet); }

.asked { margin-top: 16px; padding: 15px 16px; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 6px; }
.asked dl { margin: 10px 0 0; }
.asked dt { font-size: 14px; font-weight: 500; color: #cbd5e1; }
.asked dd { margin: 3px 0 12px; font-size: 14px; line-height: 1.6; color: var(--muted); }
.asked dd:last-child { margin-bottom: 0; }

.then { margin-top: 18px; padding-top: 13px; border-top: 1px solid var(--line); }
.then p { margin: 5px 0 0; font-size: 14px; font-weight: 500; color: #e2e8f0; }

/* ── Footer ─────────────────────────────────────────────────────────────── */
footer {
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
  padding: 10px 20px;
  background: var(--panel-2);
  border-top: 1px solid var(--line);
}
.next-up { flex: 1; min-width: 0; font-size: 12px; color: var(--dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
kbd { border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px;
  font-size: 10px; color: var(--dim); font-family: inherit; }
.by-here { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--dim); }

/* ── Narrow screens ─────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  aside { display: none; }
}

/* ── Paper backup ───────────────────────────────────────────────────────── */
#print { display: none; }
@media print {
  .app { display: none; }
  #print { display: block; color: #000; background: #fff; font-size: 11pt; }
  #print h2 { font-size: 14pt; margin: 18pt 0 2pt; page-break-after: avoid; }
  #print .m { font-size: 9pt; color: #555; margin: 0 0 6pt; }
  #print p { margin: 0 0 5pt; line-height: 1.45; }
  #print .k { font-weight: 700; font-size: 8pt; letter-spacing: .08em; text-transform: uppercase; }
  #print .stp { page-break-inside: avoid; margin-bottom: 12pt; }
  html, body { background: #fff; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div style="min-width:0">
      <h1>BuildSuite Project Hub</h1>
      <p>client walkthrough · second screen only — not the shared one</p>
    </div>
    <div class="spacer"></div>
    <div class="clock" id="clock"><span id="elapsed">0:00</span><span class="total">/ 32:00</span></div>
    <button id="toggle">Start</button>
    <button class="ghost" id="reset">Reset</button>
    <button class="ghost" id="print">Print</button>
  </header>

  <div class="body">
    <aside>
      <div class="map-wrap">
        <div class="map-head">
          <span class="label">Where to hover</span>
          <span class="screen-name" id="screen-name"></span>
        </div>
        <div class="map" id="map"></div>
        <p class="route" id="route"></p>
      </div>
      <nav id="steps"></nav>
    </aside>

    <main><div class="detail" id="detail"></div></main>
  </div>

  <footer>
    <button id="prev">&larr; Prev</button>
    <button class="primary" id="next">Next &rarr;</button>
    <div class="next-up" id="next-up"></div>
    <div class="by-here" id="by-here"></div>
    <kbd>&larr; &rarr; to move &middot; T to time</kbd>
  </footer>
</div>

<div id="print"><div id="print-body"></div></div>

<script>

const STEPS = [{"title":"Before you share","seconds":45,"screen":"signin","hover":"Nothing yet. Hands off until the share starts.","say":"Thanks for the time. Last time we showed you the plumbing before the product. Today we go the other way: what your homeowner sees first, then the control you have over it. Forty minutes, stop me whenever.","watch":"This HUD goes on the OTHER screen. Close Slack and email. Have GoHighLevel open and logged into the Alliance sub-account, and a second tab already on the Hub dashboard. Browser at 110%.\n\nThe clock counts talking time only — with questions this runs closer to an hour. If they only have twenty minutes, do the eight starred steps.","then":"Share the screen. Go to GoHighLevel."},{"title":"It lives inside GoHighLevel","seconds":75,"screen":"systems","hotspot":"ghl","hover":"The Project Hub item in the GoHighLevel left menu. Hover it, do not click yet.","say":"Nothing new to log into. The Project Hub is an item in the same left menu your team already uses. One click, no second password.","watch":"Be in the Alliance sub-account before you click. If the menu item is not there, go straight to the Hub tab and say the menu link is a GoHighLevel setting we hand over at the end — do not hunt for it live.","then":"Click it. Let the \"signing you in\" screen sit for a beat.","backend":"A GoHighLevel Custom Menu Link, opening our URL with the sub-account id on the query string — the same shape BuildSuite's own menu link uses. GoHighLevel does not substitute merge fields in these links, so each sub-account needs its own link with the id written in. A Marketplace app removes that later.","ifAsked":[{"q":"Do our staff need separate accounts?","a":"No. If they can get into GoHighLevel, they can get in here."}]},{"title":"The sign-in check","seconds":40,"screen":"signin","hover":"Nothing. Let it land on its own.","say":"That pause is us asking GoHighLevel whether this really is your account, before we show anything. It is the difference between a link that works and a link anyone could forward.","watch":"It is quick. If you miss it, do not go back for it. Say \"verifying\", never \"loading\".","then":"Land on the dashboard.","backend":"The id in the URL is a claim, not proof — plain text anyone could edit. So we call the GoHighLevel API with our own credential and ask whether that sub-account is real and reachable by us. If GoHighLevel is unreachable we refuse rather than let people through: an outage must not become an open door. The session is a signed cookie, eight hours, http-only; editing it to name another company breaks the signature."},{"title":"The contractor dashboard","seconds":100,"screen":"dashboard","hotspot":"sec-projects-needing-attention","hover":"Four tiles across the top — Active contract value, Outstanding balance, Updates awaiting review, Needs attention. Sweep them, then rest on the \"Projects needing attention\" panel below.","say":"What your PM opens with coffee. The four tiles are the money and the queue. The panel underneath is the useful part — not a list of everything, a list of what has gone quiet or gone wrong.","watch":"THIS SCREEN IS ON DEMO DATA. An amber \"Demo data\" banner sits across the top saying so, and the names are Johnson and Whitfield. Do not call these live numbers — the banner contradicts you while you speak. Point at the shape, not the figures.","then":"Point at the \"2\" badge on Field Updates in the sidebar. Then open Projects.","backend":"Fixtures. This screen reads through our data layer, which falls back to sample data until GHL_PROJECT_OBJECT_KEY is set — and even once set, that live path reads GoHighLevel custom objects, not Supabase. Two things touch BuildSuite's Supabase for real: the \"From BuildSuite\" screen, and the profile lookup at sign-in.","ifAsked":[{"q":"Is this our real data?","a":"Not on this screen — that banner says demo data and it means it. The live one is \"From BuildSuite\" in the sidebar, and sign-in resolves your real account too. I would rather tell you than have you find it."}]},{"title":"Projects — and whose they are","seconds":70,"screen":"projects","hotspot":"title","hover":"Down the project rows. Rest on Johnson Kitchen Remodel.","say":"Every job, one row each. And these are yours only. The database has other contractors in it; none of them appear here, and you do not appear in theirs.","watch":"One sentence on scoping, then move. Do not turn it into a security lecture.","then":"Click into Johnson Kitchen Remodel.","backend":"Every staff-side read takes a tenant as its first argument and will not compile without one. Not theoretical — in August the live database had 43 projects across five contractors visible to any signed-in user, and this is what fixed it. Two client-side reads deliberately take no tenant, because a homeowner may have jobs with more than one contractor; those are constrained by the gate instead."},{"title":"One project, one record","seconds":90,"screen":"project","hotspot":"sec-financials","hover":"Five panels down the page — Timeline, Field updates, Financials, Client visibility, Assigned team. Rest on Financials.","say":"One record holds the whole job. Stage, updates, the crew, and the money — including your cost and your margin. Hold that thought, because it is why the next screen exists.","watch":"Do not rush past the margin figure and do not apologise for it being on screen. You are setting up the payoff.","then":"Scroll to the \"Client visibility\" panel and click \"Edit visibility →\"."},{"title":"Client Visibility Settings","seconds":160,"screen":"visibility","hotspot":"sec-switches","star":true,"hover":"The Switches panel on the left. Then move right to \"What the client actually gets\".","say":"This is the screen nobody else has. Every switch is a decision about what your homeowner may see. Schedule on. Budget off. Photos on. Per project, not per company. And the panel on the right is not a description — it is the portal answering live. Flip a switch, save, it changes.","watch":"Actually toggle one and press \"Save visibility\". A screen you describe is a mockup; a screen you change in front of them is a product. Turn it back afterwards.","then":"Scroll to the \"Never visible\" panel.","backend":"Each switch is a field on the project record and a clause in the check that runs before any client response is assembled. The right-hand panel calls the same function the real portal calls, so it cannot show something the portal would not do.","ifAsked":[{"q":"Can we set defaults instead of doing this per job?","a":"Not yet — that is a settings screen we have not built. Per-project control had to be right first."}]},{"title":"What no switch can turn on","seconds":80,"screen":"visibility","hotspot":"sec-never-visible-whatever-the-switches-","star":true,"hover":"The panel headed \"Never visible, whatever the switches say\".","say":"Then there is this. Your cost, your markup, your margin, your internal notes, supplier invoices. There is no switch for these, because we did not build one. They are removed before the page is built, not hidden on it. Nobody can misconfigure their way into showing a client their margin.","watch":"Say \"we did not build a switch for it\", not \"it is disabled\". The absence is the point.","then":"Go to Field Updates in the sidebar.","backend":"Two mechanisms, and the difference is the point. The switches are a deny-list: things you can turn off. Costs and margin use an allow-list — we name the fields a client may receive and build the response from only those. Deny-lists fail open, so a field someone forgets gets exposed. Allow-lists fail closed: a new field is invisible until somebody deliberately allows it.","ifAsked":[{"q":"What about a cost-plus job where the client should see costs?","a":"Then that becomes a deliberate feature with its own control, not a switch sitting there waiting to be flipped by accident. Worth a conversation."}]},{"title":"The review queue","seconds":70,"screen":"updates","hotspot":"sec-johnson-kitchen-remodel","hover":"The two pending cards — Johnson Kitchen Remodel and Whitfield Master Suite Addition.","say":"Your superintendent files an update from their phone on site. It arrives here. Notice what has not happened: your client has not been told anything.","watch":"There must be at least one pending update before the call, or the next three steps have nothing to stand on. Two are seeded — check they are still there.","then":"On the Johnson card, point at the red internal notes block.","backend":"An update moves through a small state machine and the names matter: Pending, Approved Internally, Approved & Published. Only the last is visible to a client. Approved Internally reads like approval and deliberately is not."},{"title":"Two boxes — the argument","seconds":150,"screen":"updates","hotspot":"sec-johnson-kitchen-remodel","star":true,"hover":"The red internal-notes block, then the client summary box under it.","say":"Two boxes. The red one is what the crew wrote — the tile came in wrong, the supplier let us down, we lost a day. The one below is what the client reads, and your PM edits it before it goes. Same event, two audiences. The crew never has to be diplomatic; the client never reads a raw complaint about a supplier.","watch":"Read a line of the red text out loud. Then actually type an edit into the client summary. This is where the call turns, and it turns on it being live rather than described.","then":"Move to the four buttons underneath.","backend":"Two separate fields on the record, not one field shown twice. No code path copies the internal note into the client summary. That is why the portal screen later can prove the complaint was not sent — it was never in the field that gets published.","ifAsked":[{"q":"Does the crew see what the PM changed?","a":"Not today. Fair ask, and the kind of thing we would add once you are using it."}]},{"title":"Four ways to answer","seconds":80,"screen":"updates","hotspot":"btn-approve-and-publish","hover":"The four buttons on the card — Approve and Publish, Approve Internally, Edit Client Summary, Return for Revision.","say":"Four choices. Publish it and the client gets the edited version. Approve internally and it is on your record but the client never sees it. Edit the summary first. Or send it back to the crew. Most systems give you one button. The second one matters most — plenty of a day is worth recording and not worth reporting.","watch":"Name all four before clicking anything. Then click Approve and Publish.","then":"Click Approve and Publish.","backend":"Publishing runs a defined workflow, WF4, rather than updates scattered through a button handler. The workflow is a pure function: given this state, here are the effects — set the status, notify the contact, stamp the date. Something else carries them out, so we can test what a publish does without sending anyone a real notification, and an effect with no handler fails the build."},{"title":"Switch to their side","seconds":55,"screen":"updates","hotspot":"switcher","star":true,"hover":"Top right of the header — \"Viewing as Contractor\". Click it, choose Client Portal.","say":"Now I am going to become your customer. Same browser, other side of the gate.","watch":"An orange bar appears saying you are viewing as someone else. Point at it and say it before they ask: this is a demo shortcut so I can show both sides in one sitting, and your homeowner gets their own login by email invitation. Announced, it reads as considered. Discovered, it reads as a hole.","then":"Land on the client portal.","backend":"It rewrites and re-signs the session cookie, keeping your real identity inside so the return trip is exact. Two guards: the field view inherits your own tenant keys and never the demo account's, or a switch would show you another agency's jobs; and the client view carries no tenant key at all, because a client is scoped through their contact record.","ifAsked":[{"q":"So a contractor can log in as their client?","a":"Only in this demo build, so I can show you both views in one call. Real clients get their own invitation and password — that is the next thing we build."}]},{"title":"Thirteen screens","seconds":100,"screen":"portal","hotspot":"nav-completion-warranty","star":true,"hover":"Run slowly down the whole left nav — all thirteen, ending on Completion & Warranty. Say nothing until you reach the bottom.","say":"Thirteen screens. Timeline, schedule, daily updates, designs, budget, change orders, documents, photos, messages, issues, payments, completion. This is what we got wrong last time — not the thinking, the order we showed it in. You asked to see a client portal and we showed you a database.","watch":"Slow down here. Let the list be seen before you talk over it. This step exists to repair one specific impression: that we had built less than we had.","then":"Move to the top of the page."},{"title":"Their project, their language","seconds":90,"screen":"portal","hotspot":"title","hover":"The project name at the top, then the \"Your input is needed\" card, then \"Current stage — In Progress\".","say":"Their job, in their words. Where it is now, what needs them next, what is coming. Your pipeline has nineteen stages because running a job takes nineteen. They see the one that matters, in plain English. Same record, translated.","watch":"There are two Johnson projects in the switcher at the top — a homeowner can have more than one job with you. Worth a sentence if they notice it.","then":"Open Daily Updates in the nav.","backend":"Nineteen stages collapse to six for the client via a lookup table; an unrecognised stage falls back to Planning rather than throwing. A client seeing a slightly early stage is confusing; a crashed page is worse. The six are our reading, not something anyone confirmed — worth asking them.","ifAsked":[{"q":"Can we change what the stages are called?","a":"Yes, and we would rather you did. Tell us what a homeowner should see and we will map it."}]},{"title":"The same update, transformed","seconds":110,"screen":"portalUpdates","hotspot":"title","star":true,"hover":"The top entry — the update you published two minutes ago.","say":"There it is. The update we approved a minute ago, in the clean version your PM wrote. Now tell me where the supplier complaint went. It is not further down and it is not hidden behind anything. It was never sent.","watch":"This is the closing argument. Pause after \"it was never sent\" and let them fill the silence.","then":"Open Documents.","backend":"Four checks ran before this response was built: is the portal on for this project, is the item client-visible, is it in a published state, does this contact own this project. First failure wins. Then internal fields are stripped from what is left. It happens where the data is read, so no page, no API call and no browser trick returns the internal note."},{"title":"Documents — proof by absence","seconds":100,"screen":"portalDocuments","hotspot":"title","star":true,"hover":"The Document Center list. Count the rows out loud if it helps.","say":"Five documents here. There are six on the project. The missing one is a supplier invoice, marked internal. A list that showed you everything would prove nothing — this one is short on purpose, and that is the feature.","watch":"Five of six is what the fixtures hold today. Count the rows on screen before the call and use the real number, or describe the shape and skip the figures.","then":"Click Photos & Videos.","backend":"Default-deny. An item is invisible unless something explicitly marks it visible, so a document uploaded and never reviewed does not reach a client by sitting there. The failure mode is a homeowner asking why they cannot see something, which is a phone call. The other way round is a leak."},{"title":"Photos, and the one held back","seconds":70,"screen":"portalPhotos","hotspot":"title","hover":"The photo grid.","say":"Same rule. Three photos published, four on the job. The held-back one is a scratched door with a replacement already ordered — your call whether that is a conversation you want before it is fixed, rather than the system deciding for you.","watch":"Keep it short. You have made the argument; this is confirmation.","then":"Click Designs & Selections."},{"title":"What is not built yet","seconds":85,"screen":"portalDesigns","hotspot":"title","star":true,"hover":"The \"coming shortly\" panel. Do not click away quickly.","say":"Straight with you on this one. Designs, budget, change orders and payments are designed and not built. They are in the navigation because your client should see what is coming rather than hit a dead end. Roughly two weeks.","watch":"Do not skip this and do not rush it. You lost trust by them finding a gap themselves; you get it back by showing them one first. Only give the two-week estimate if you can stand behind it.","then":"Switch back to your account. Narrow the window, then go to the field view.","ifAsked":[{"q":"Why show them at all if they are empty?","a":"The alternative is a homeowner clicking a link, getting nothing, and deciding the product is broken. The demo you liked does the same on its warranty screen."}]},{"title":"The field interface","seconds":90,"screen":"field","hotspot":"sec-add-daily-update","hover":"Narrow the browser to phone width FIRST. Then: Today's tasks, the \"Add daily update\" form, and \"Submit to Project Manager\" at the bottom.","say":"The crew, on a phone, in a driveway. Big targets, few fields, thirty seconds to file. And the same two boxes from the other end: what happened, and what the client should hear. The crew writes both, your PM decides. That is the loop.","watch":"Resize before you switch, not after. Watching a desktop layout squeeze down live looks unfinished.","then":"Stop navigating. Move to the close.","backend":"Submitting runs WF3, which notifies the project manager and never the client. There is no code path from a field submission to a client notification. The only route to a homeowner is a PM pressing publish."},{"title":"What is live, what is not","seconds":110,"screen":"buildsuite","hotspot":"sec-active-projects","star":true,"hover":"Open \"From BuildSuite\" in the sidebar. This one IS your live data — show it.","say":"Where this stands, bluntly. Sign-in through GoHighLevel is real, against your live account. This screen is reading your real BuildSuite database — those projects started as leads in GoHighLevel, went into BuildSuite to be bid, and we read them back out. Everything else today ran on demo data, and the amber banner said so the whole time. That is one configuration value and your team's sign-off on our tables, not a gap in the build.","watch":"Say this even if nobody asks — it decides whether they believe the rest. Ending on the live screen rather than a fixture screen is deliberate: finish on something real.","then":"Go into the asks.","backend":"Next.js on Vercel, reading BuildSuite's Supabase read-only and GoHighLevel over its API. Our own tables are written and not yet created — that is the sign-off. 189 automated tests, and the ones that matter assert the rules rather than the screens."},{"title":"The two asks","seconds":100,"screen":"buildsuite","hover":"Nothing on screen. Have the two asks written down in front of you.","say":"Two things from you. First: are those six client stages the right six? You run these jobs, we do not. Second: we need your team to create the Hub tables in the database. We have written the change and we will not run it ourselves on a live system. Give us those and the four remaining screens land next.","watch":"Two asks, not five. Listing everything you are blocked on reads as a project in trouble rather than one waiting on a decision. The BuildSuite-side dependencies are NOT asks — keep them in the annex.","then":"Ask for the next meeting."},{"title":"Close","seconds":50,"screen":"buildsuite","hover":"Stop the screen share before the goodbyes, not after.","say":"Last thing. You told us this felt backward, and you were right about what we showed you. What you saw today is what we had built, in the order it should have been shown. Can we get thirty minutes with whoever runs your jobs day to day, so the next version is shaped by them rather than by us guessing?","watch":"Concede in one sentence, name what changed, ask for the next thing. Do not relitigate the last meeting.","then":"Stop sharing. Follow up within the hour, while they still remember the two boxes."},{"title":"How the three systems fit","seconds":100,"screen":"systems","hotspot":"inbound","section":"annex","hover":"The inbound arrow first, then the handoff, then the sync-back.","say":"A loop, not a line. Leads land in GoHighLevel — your CRM, contacts, messaging. They cross into BuildSuite to be estimated and bid. When one signs, it hands back to GoHighLevel, which owns the job from then on. The Hub is the operational layer on top. The projects you saw came out of BuildSuite, and BuildSuite got them from GoHighLevel. We are reading the far end of your own pipeline.","watch":"Get the direction right — GoHighLevel into BuildSuite first, then back at signing. Backwards makes it sound like we do not know where their data lives.","then":"Back to wherever you jumped in from.","backend":"The signing handoff is once and one-directional. Two systems writing the same operational records is how you get a project in two states with no way to say which is right. Everything joins on one key, the BuildSuite project id — never a name, address or email, because those get edited."},{"title":"Where the data lives","seconds":90,"screen":"stack","hotspot":"data","section":"annex","hover":"The layers, bottom to top.","say":"Three stores. GoHighLevel holds contacts, the pipeline and messaging. BuildSuite holds estimates and the project record. Our own operational tables — updates, approvals, visibility — are written and waiting on your team to create them. We hold nothing you cannot see.","then":"Back to wherever you jumped in from.","backend":"Eight new tables, all prefixed hub_, create-only: no ALTER, no DROP, nothing of BuildSuite's touched. RLS enabled deny-by-default on every one, and both tenancy keys on every row, so a row cannot be read without knowing whose it is. Not run: the app's key cannot execute DDL, which is correct — a running application should never be able to change its own schema. It needs the service role and Sing's sign-off, since it is his database."},{"title":"Why the gate is not a UI rule","seconds":90,"screen":"stack","hotspot":"gate","section":"annex","star":true,"hover":"The gate layer in the middle.","say":"The usual way to build this is to hide things in the page. We do it where the data is read, one layer below every screen. So there is no page, no export, no API call and no browser trick that returns what the gate removed. It is not that the client cannot see it — it was never sent to their browser.","then":"Back to wherever you jumped in from.","backend":"Four clauses, first failure wins, then internal fields are stripped from what survives. Anywhere that assembles a client response without calling both is a defect even if the UI happens to hide it — that rule is in the repo's contributing notes, with tests asserting it."},{"title":"How one agency cannot see another","seconds":80,"screen":"stack","hotspot":"data","section":"annex","hover":"The data layer.","say":"Every staff-side read takes the tenant as its first argument and will not compile without one. Not a filter someone remembers to add — code that forgets it does not build.","watch":"If they ask whether this was ever wrong: yes, and say so. In August we found 43 projects across five contractors visible to any signed-in user. Finding it is the reason it is now structural.","then":"Back to wherever you jumped in from.","backend":"The tenant is the GoHighLevel sub-account, matching how BuildSuite works. One location maps to several BuildSuite profiles — the live Alliance account has two admin profiles owning nine projects between them, so scoping to one would have hidden half an agency's work from itself."},{"title":"When something breaks","seconds":80,"screen":"systems","hotspot":"hub","section":"annex","hover":"The Project Hub box.","say":"If GoHighLevel is unreachable at sign-in, we refuse rather than let people in — an outage must not become an open door. If our app is down, GoHighLevel and BuildSuite carry on; nothing depends on us to keep working, and nothing is stored only here.","then":"Back to wherever you jumped in from.","backend":"Auth failures are classified rather than lumped together: an unknown sub-account, a bad credential of ours, and GoHighLevel being unreachable produce three different messages, because they need three different fixes. Measured against the live API — an unreachable location returns 403, not 404, which we had wrong at first, and it sent people off to check their wifi."},{"title":"What is left","seconds":100,"screen":"stack","section":"annex","hover":"Nothing. Eye contact.","say":"Four portal screens designed and not built: designs, budget, change orders, payments. Field and client logins designed and not built. Our tables need creating in your database. Multi-tenant sign-in needs a GoHighLevel Marketplace app before the second client, not after. Two more things we are waiting on from the BuildSuite side. Everything else is real.","watch":"Say this list the same way whether asked or not. Do not name individuals to the client — \"the BuildSuite side\" is enough.","then":"Go to the two dependencies.","backend":"The four screens are placeholders with designs behind them, not missing routes, so the nav is honest about what is coming. Multi-tenant is the real dependency: the token we authenticate with is scoped to one sub-account, so a second client needs the Marketplace app."},{"title":"The two we are waiting on","seconds":110,"screen":"systems","hotspot":"inbound","section":"annex","star":true,"hover":"The inbound arrow — leads coming into BuildSuite from GoHighLevel.","say":"Two open dependencies, both on the BuildSuite side, both about which projects we show rather than how. First, the list reads every project BuildSuite holds for the account; it should show only closed, signed work, and that needs the client-to-contractor matching finished before we can filter on it. Second, we cannot find how a contractor bid is classified in the data, so we cannot yet tell a won bid from an open one. Neither blocks a screen. Both decide what the list contains.","watch":"INTERNAL — do not say these names to the client: the matching is Sing's, and the bid classification is the one Pat set up that we cannot locate in the schema. Externally: \"the BuildSuite side\" and \"how bids are classified\".\n\nKeep these out of the two asks. Those are the client's decisions; these are things another team owes us.","then":"Back to wherever you jumped in from.","backend":"We read projects for the account filtered on active status, with no notion of \"this deal was won\". Until the matching lands there is no reliable join from a contractor to the client whose deal they closed, so \"only closed deals\" cannot be expressed as a query. We have been through the columns and cannot find the field or value marking a bid as won, so any filter would be a guess.","ifAsked":[{"q":"So the dashboard numbers are wrong?","a":"They are that account's, but the list is broader than it should be — it includes work that is not signed yet. Narrowing it is a filter we are waiting on, not a rebuild."}]}];

// The annex is optional reference material, so it must not inflate the time the
// call is sold as, nor the "step N of M" the presenter is pacing against.
const isWalk = (s) => s.section !== 'annex';
const WALK = STEPS.filter(isWalk).length;
const TOTAL = STEPS.filter(isWalk).reduce((s, x) => s + x.seconds, 0);

let index = 0;
let elapsed = 0;
let running = false;
let ticker = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = (n) => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
const human = (n) => n < 60 ? n + ' sec' : (Number.isInteger(n / 60) ? n / 60 + ' min' : (n / 60).toFixed(1) + ' min');
const plannedBy = (i) => STEPS.slice(0, i + 1).filter(isWalk).reduce((s, x) => s + x.seconds, 0);

function drawMap() {
  const step = STEPS[index];
  const screen = SCREENS[step.screen];
  $('screen-name').textContent = screen.name;
  $('route').textContent = screen.route;
  $('map').style.gridTemplateRows = 'repeat(' + (screen.rows || 14) + ', minmax(0, 1fr))';
  $('map').innerHTML = screen.blocks.map((b) => {
    const lit = b.id === step.hotspot;
    const style = 'grid-column:' + b.col[0] + '/span ' + b.col[1] + ';grid-row:' + b.row[0] + '/span ' + b.row[1];
    return '<div class="blk ' + b.kind + (lit ? ' lit' : '') + '" style="' + style + '">'
      + (lit ? '<span class="num">' + index + '</span>' : '')
      + (b.label ? '<span class="t">' + esc(b.label) + '</span>' : '')
      + '</div>';
  }).join('');
}

function drawList() {
  $('steps').innerHTML = STEPS.map((s, i) => {
    const cls = i === index ? 'active' : (i < index ? 'done' : '');
    const head = (!isWalk(s) && isWalk(STEPS[i - 1] || {}))
      ? '<div class="annex-head">Annex &middot; how it works</div>' : '';
    return head + '<button class="step-btn ' + cls + '" data-i="' + i + '">'
      + '<span class="n">' + i + '</span>'
      + '<span class="ttl">' + esc(s.title) + '</span>'
      + (s.star ? '<span class="star">&#9733;</span>' : '')
      + '</button>';
  }).join('');
  // Query the buttons rather than walking children — the annex divider is a
  // sibling and has no step index on it.
  for (const b of $('steps').querySelectorAll('.step-btn')) {
    b.onclick = () => go(Number(b.dataset.i));
  }
}

function box(kind, label, text) {
  return '<div class="box ' + kind + '"><div class="bar"></div><div style="min-width:0">'
    + '<div class="label">' + label + '</div><p>' + esc(text) + '</p></div></div>';
}

function drawDetail() {
  const s = STEPS[index];
  const heading = isWalk(s)
    ? 'Step ' + index + ' of ' + (WALK - 1)
    : '<span class="annex-tag">Annex &middot; not part of the walkthrough</span>';
  let html = '<div class="label">' + heading + '</div>'
    + '<h2>' + esc(s.title) + (s.star ? ' <span class="star">&#9733;</span>' : '') + '</h2>'
    + '<div class="dur">~' + human(s.seconds) + '</div>'
    + box('hover', 'Put the mouse here', s.hover);
  if (s.watch) html += box('watch', 'Watch out', s.watch);
  html += box('say', 'Say', s.say);
  if (s.backend) html += box('backend', 'Under the hood &mdash; only if asked', s.backend);
  if (s.ifAsked) {
    html += '<div class="asked"><div class="label">If they ask</div><dl>'
      + s.ifAsked.map((qa) => '<dt>' + esc(qa.q) + '</dt><dd>' + esc(qa.a) + '</dd>').join('')
      + '</dl></div>';
  }
  html += '<div class="then"><div class="label">Then</div><p>' + esc(s.then) + '</p></div>';
  $('detail').innerHTML = html;
  $('detail').parentElement.scrollTop = 0;
}

function drawFooter() {
  const next = STEPS[index + 1];
  $('next-up').textContent = next ? 'Next: ' + next.title : 'End of the walkthrough';
  $('by-here').textContent = 'by here: ' + clock(plannedBy(index));
  $('prev').disabled = index === 0;
  $('next').disabled = index === STEPS.length - 1;
}

function drawClock() {
  $('elapsed').textContent = clock(elapsed);
  $('clock').classList.toggle('behind', running && elapsed > plannedBy(index) + 60);
  $('toggle').textContent = running ? 'Pause' : 'Start';
}

function render() {
  drawMap(); drawList(); drawDetail(); drawFooter(); drawClock();
}

function go(n) {
  index = Math.max(0, Math.min(STEPS.length - 1, n));
  location.hash = String(index);
  render();
}

$('prev').onclick = () => go(index - 1);
$('next').onclick = () => go(index + 1);
$('toggle').onclick = () => {
  running = !running;
  clearInterval(ticker);
  if (running) ticker = setInterval(() => { elapsed++; drawClock(); }, 1000);
  drawClock();
};
$('reset').onclick = () => { running = false; clearInterval(ticker); elapsed = 0; drawClock(); };
$('print').onclick = () => window.print();

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(index + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(index - 1); }
  else if (e.key.toLowerCase() === 't') { $('toggle').click(); }
});

// Paper backup — every step, linear, only visible when printing.
$('print-body').innerHTML = '<h1>' + esc("BuildSuite Project Hub") + '</h1>' + STEPS.map((s, i) =>
  '<div class="stp"><h2>' + i + '. ' + esc(s.title) + (s.star ? ' \u2605' : '') + '</h2>'
  + '<p class="m">~' + human(s.seconds) + ' &middot; ' + esc(SCREENS[s.screen].name) + '</p>'
  + '<p><span class="k">Hover</span> ' + esc(s.hover) + '</p>'
  + (s.watch ? '<p><span class="k">Watch</span> ' + esc(s.watch) + '</p>' : '')
  + '<p><span class="k">Say</span> ' + esc(s.say) + '</p>'
  + (s.backend ? '<p><span class="k">Under the hood</span> ' + esc(s.backend) + '</p>' : '')
  + (s.ifAsked ? s.ifAsked.map((qa) => '<p><span class="k">If asked</span> ' + esc(qa.q) + ' &mdash; ' + esc(qa.a) + '</p>').join('') : '')
  + '<p><span class="k">Then</span> ' + esc(s.then) + '</p></div>').join('');

const fromHash = parseInt(location.hash.replace('#', ''), 10);
if (Number.isInteger(fromHash)) index = Math.max(0, Math.min(STEPS.length - 1, fromHash));
render();

</script>
